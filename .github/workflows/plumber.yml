name: Plumber

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  plumber:
    name: Plumber
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      # Nécessaire à score-push pour publier le score affiché par le badge du README.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: getplumber/plumber@d3536bae4727b9290d9e69ee25c4350ddbcd91cd # v0.6.0
        with:
          # L'upload vers code scanning demande security-events: write, que les
          # PR venant d'un fork n'ont pas. Le rapport reste disponible en artefact.
          upload-sarif: ${{ github.event.pull_request.head.repo.fork != true }}
          # Publie le score sur score.getplumber.io, qui alimente le badge du
          # README. Un échec de publication ne fait jamais échouer le job.
          score-push: true
          # Seuil à 85 points plutôt que le tout-ou-rien par défaut : une
          # petite remarque ne bloque pas une PR.
          min-points: 85
