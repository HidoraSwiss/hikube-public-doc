name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    # Review gh actions docs if you want to further define triggers, paths, etc
    # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#on
  # Redéploiement manuel de main, sans repasser par un ancien run
  workflow_dispatch:

# Un seul déploiement à la fois, dans l'ordre des pushs : sans ce groupe, deux
# fusions rapprochées lancent deux runs en parallèle et le plus lent écrase le
# plus récent. Pas de cancel-in-progress, pour ne jamais couper un déploiement
# déjà en cours d'écriture sur Pages.
concurrency:
  group: pages
  cancel-in-progress: false

# Le job build ne fait que lire le dépôt. Le job deploy déclare ses propres
# droits (pages, id-token) plus bas.
permissions:
  contents: read

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Rien ne pousse avec git ici, inutile de laisser le token dans .git/config
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
      - name: Build website
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    name: Deploy to GitHub Pages
    needs: build

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5